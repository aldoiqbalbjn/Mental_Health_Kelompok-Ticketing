<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframe - Login MindCare</title>
<link rel="stylesheet" href="assets/wireframe.css">
</head>
<body>
<div class="wf-login">
    <div class="wf-card">
        <div class="wf-brand"><span class="wf-logo">MC</span> MindCare Student</div>
        <h1>Masuk ke akun</h1>
        <p class="wf-sub">Ruang aman untuk memantau kesehatan mentalmu.</p>

        <div class="wf-field">
            <label>Username</label>
            <input class="wf-input" placeholder="contoh: mhs001 / admin">
        </div>
        <div class="wf-field">
            <label>Password</label>
            <input class="wf-input" type="password" placeholder="••••••••">
        </div>

        <div class="wf-note" style="margin-bottom:14px;">
            Wireframe: validasi kosong, pesan error, dan tombol lihat password.
        </div>

        <button class="wf-btn" style="width:100%; justify-content:center;">Masuk</button>
        <p class="wf-footer">Belum punya akun? Hubungi admin kampus.</p>
    </div>
</div>
</body>
</html>
